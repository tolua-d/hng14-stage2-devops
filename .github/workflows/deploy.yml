name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# One pipeline per branch at a time; new pushes cancel in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Registry running as a service container inside the build job
  REGISTRY: localhost:5000

jobs:
  lint:
    name: "1 · Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python (flake8)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python
        run: flake8 api/main.py worker/worker.py api/tests.py

      # JavaScript (eslint) 
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ESLint
        working-directory: frontend
        run: npm install --save-dev eslint@8

      - name: Lint JavaScript
        working-directory: frontend
        run: npx eslint app.js

      # Dockerfiles (hadolint)
      - name: Install hadolint
        run: |
          wget -qO /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/v2.14.0/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: |
          hadolint api/Dockerfile
          hadolint worker/Dockerfile
          hadolint frontend/Dockerfile

  test:
    name: "2 · Test"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install \
            fastapi==0.111.0 \
            "uvicorn[standard]==0.30.1" \
            redis==5.0.8 \
            pytest \
            pytest-cov \
            httpx

      - name: Run unit tests with coverage
        run: |
          pytest \
            --cov=api \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  build:
    name: "3 · Build"
    runs-on: ubuntu-latest
    needs: test
    # Run a local registry as a service container so we can push/pull images
    # inside the runner without any external registry credentials.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          SHA="${{ github.sha }}"
          TAG="${SHA::8}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Point Buildx at the in-job registry (no TLS needed for localhost)
          driver-opts: network=host

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/hng-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/hng-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/hng-worker:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/hng-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/hng-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/hng-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Save image tarballs so downstream jobs can load them without a registry
      - name: Export images as tarballs
        run: |
          docker pull ${{ env.REGISTRY }}/hng-api:${{ steps.meta.outputs.tag }}
          docker pull ${{ env.REGISTRY }}/hng-worker:${{ steps.meta.outputs.tag }}
          docker pull ${{ env.REGISTRY }}/hng-frontend:${{ steps.meta.outputs.tag }}
          docker save \
            ${{ env.REGISTRY }}/hng-api:${{ steps.meta.outputs.tag }} \
            ${{ env.REGISTRY }}/hng-worker:${{ steps.meta.outputs.tag }} \
            ${{ env.REGISTRY }}/hng-frontend:${{ steps.meta.outputs.tag }} \
            -o images.tar

      - name: Upload image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar
          retention-days: 1

  security:
    name: "4 · Security Scan"
    runs-on: ubuntu-latest
    needs: build
    # Allow SARIF upload even when Trivy finds issues so results appear in
    # GitHub Security tab; the job still fails on CRITICAL findings.
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Download image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load images
        run: docker load -i images.tar

      - name: Install Trivy
        run: |
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan API image
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --format sarif \
            --output trivy-api.sarif \
            ${{ env.REGISTRY }}/hng-api:${{ needs.build.outputs.image_tag }}

      - name: Scan worker image
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --format sarif \
            --output trivy-worker.sarif \
            ${{ env.REGISTRY }}/hng-worker:${{ needs.build.outputs.image_tag }}

      - name: Scan frontend image
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --format sarif \
            --output trivy-frontend.sarif \
            ${{ env.REGISTRY }}/hng-frontend:${{ needs.build.outputs.image_tag }}

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "."
          category: trivy

  integration:
    name: "5 · Integration Test"
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - name: Download image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load images
        run: docker load -i images.tar

      # Re-tag from registry prefix to the names Compose expects
      - name: Retag images for Compose
        run: |
          TAG="${{ needs.build.outputs.image_tag }}"
          docker tag ${{ env.REGISTRY }}/hng-api:${TAG}      hng-api:${TAG}
          docker tag ${{ env.REGISTRY }}/hng-worker:${TAG}   hng-worker:${TAG}
          docker tag ${{ env.REGISTRY }}/hng-frontend:${TAG} hng-frontend:${TAG}

      - name: Bring stack up
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          REDIS_HOST: redis
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          API_URL: http://api:8000
          FRONTEND_PORT: "3000"
        run: |
          docker compose up -d
          # Give services time to start and pass their own health checks
          echo "Waiting for stack to become healthy..."
          timeout 120 bash -c \
            'until [ "$(docker compose ps --format json | \
              python3 -c "import sys,json; d=json.load(sys.stdin); \
              print(all(s.get(\"Health\",\"healthy\")==\"healthy\" for s in (d if isinstance(d,list) else [d])))")" = "True" ]; \
            do sleep 3; done' \
            || (docker compose logs; exit 1)

      - name: Run integration test
        run: python3 scripts/integration_test.py --frontend-url http://localhost:3000 --timeout 60

      - name: Tear down stack (always)
        if: always()
        run: docker compose down -v --remove-orphans

  deploy:
    name: "6 · Deploy"
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deploy assets to server
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            scripts/rolling_deploy.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Pull new images on server
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             docker pull ${{ secrets.REGISTRY_HOST }}/hng-api:${TAG} && \
             docker pull ${{ secrets.REGISTRY_HOST }}/hng-worker:${TAG} && \
             docker pull ${{ secrets.REGISTRY_HOST }}/hng-frontend:${TAG}"

      - name: Rolling deploy — API
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             HEALTH_TIMEOUT=60 bash rolling_deploy.sh api \
               ${{ secrets.REGISTRY_HOST }}/hng-api:${TAG}"

      - name: Rolling deploy — Worker
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             HEALTH_TIMEOUT=60 bash rolling_deploy.sh worker \
               ${{ secrets.REGISTRY_HOST }}/hng-worker:${TAG}"

      - name: Rolling deploy — Frontend
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             HEALTH_TIMEOUT=60 bash rolling_deploy.sh frontend \
               ${{ secrets.REGISTRY_HOST }}/hng-frontend:${TAG}"

      - name: Verify production health
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker compose -f ${{ secrets.DEPLOY_PATH }}/docker-compose.yml ps"